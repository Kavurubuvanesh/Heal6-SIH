# Heal6 Patient Edge Intake App - Production Nginx Configuration
# Configured for ONNX Runtime Web, WebAssembly SIMD, and Cross-Origin Isolation

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Maximum upload file size for high-res camera captures
    client_max_body_size 25M;

    # Enable WebAssembly and binary model MIME types
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
        text/mathml                           mml;
        text/plain                            txt;
        text/vnd.sun.j2me.app-descriptor      jad;
        text/vnd.wap.wml                      wml;
        text/x-component                      htc;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        application/json                      json;
        application/wasm                      wasm;
        application/octet-stream              bin exe dll deb dmg iso img msi msp msm onnx;
    }

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    # Production Security & Cross-Origin Isolation Headers
    # Required for SharedArrayBuffer and ONNX Runtime Web multi-threaded execution
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache headers for quantized edge ONNX models and Wasm binaries
    location ~* \.(onnx|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        access_log off;
    }

    # Hashed static assets - 1 Year Immutable Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public images & icons - 30 Days Cache
    location ~* \.(ico|png|jpg|jpeg|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Reverse Proxy for Backend Telemetry REST API
    location /api/ {
        proxy_pass http://heal6-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health Check for Container Orchestration
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"patient-app"}';
        add_header Content-Type application/json;
    }

    # Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
